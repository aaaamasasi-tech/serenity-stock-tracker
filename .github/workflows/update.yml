name: Update Serenity Tracker Data

on:
  schedule:
    # 毎時0分に実行（月曜〜金曜）
    - cron: '0 * * * 1-5'
  
  # GitHubの画面から手動で実行できるようにするボタンを有効化
  workflow_dispatch:

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限を許可

    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 必要なライブラリのインストール
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      # 4. 株価取得Pythonスクリプトを実行
      - name: Run Stock Fetcher Script
        run: |
          python serenity_tracker.py

      # 5. 更新された JSON を git コミット＆プッシュ
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add serenity_data.json
          
          # 変更がある場合のみコミット
          if git diff --staged --quiet; then
            echo "No changes in stock data. Skipping commit."
          else
            git commit -m "auto: update Serenity tracker data [skip ci]"
            git push
          fi
